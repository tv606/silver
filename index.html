<!DOCTYPE html>
<html lang="tr">
<head>

  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="apple-touch-icon" sizes="180x180" href="silver-icon.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Silver Stream">
  <title>SilverStream</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --card-border: #232d42;
      
      /* METALİK GÜMÜŞ TEMA RENKLERİ */
      --accent: #e2e8f0;
      --accent-hover: #94a3b8;
      --accent-glow: rgba(226, 232, 240, 0.25);
      --silver-gradient: linear-gradient(135deg, #ffffff, #94a3b8);
      
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --header-bg: rgba(11, 15, 25, 0.88);
      --modal-overlay: rgba(0, 0, 0, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    html {

      scrollbar-color: #151E33 #090D16 ;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;

    }

    /* ================= HEADER & SEARCH ================= */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--header-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 0.85rem 1.5rem;
    }

    .header-container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
       
      text-decoration: none;
      color: var(--text);
      font-size: 1.5rem;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
    }

    .brand-icon {
      background: var(--silver-gradient);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .brand strong { 
      background: var(--silver-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 0.35rem 0.75rem;
      width: 100%;
      max-width: 320px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .search-box input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 0.9rem;
      width: 100%;
      padding: 0.3rem 0.5rem;
    }

    .search-box button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
    }

    .search-box button:hover {
      color: var(--accent);
    }

    /* ================= MAIN CONTENT ================= */
    main {
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      background-color: #151E33;
    }

    .category-section { margin-bottom: 3.5rem; }

    .category-title {
      font-size: 1.35rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-left: 0.5rem;
      border-left: 4px solid var(--accent);
    }

    .category-title span.badge {
      font-size: 0.75rem;
      color: var(--text-muted);
      background: var(--card-bg);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--card-border);
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: var(--accent);
      box-shadow: 0 12px 24px -10px rgba(255, 255, 255, 0.15);
    }

    .card img {
      width: 100%;
      height: 270px;
      object-fit: cover;
      background: #1e293b;
    }

    .card-content {
      padding: 0.9rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 0.92rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: auto;
    }

    .card-rating { color: var(--accent); font-weight: 700; }

    .loader {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--accent);
      font-weight: 600;
    }

    /* ================= MODAL & PLAYER ================= */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: var(--modal-overlay);
      backdrop-filter: blur(8px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-overlay.active { display: flex; }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .close-modal {
      position: absolute;
      top: 1rem; right: 1.25rem;
      background: rgba(0, 0, 0, 0.6);
      color: var(--text);
      border: none;
      width: 36px; height: 36px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      z-index: 10;
      transition: background 0.2s;
    }

    .close-modal:hover { background: #ef4444; }

    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      padding: 1.75rem;
    }

    .modal-top-section { display: flex; gap: 1.5rem; }
    .modal-poster { width: 220px; border-radius: 12px; object-fit: cover; }
    .modal-info { display: flex; flex-direction: column; gap: 0.8rem; }
    .modal-title { font-size: 1.6rem; font-weight: 800; }
    .modal-meta-bar { display: flex; gap: 1rem; font-size: 0.9rem; color: var(--text-muted); }
    .modal-overview { font-size: 0.92rem; line-height: 1.6; color: #cbd5e1; }

    /* Player Controls & Server Switcher */
    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .player-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
    }

    .server-list { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    .server-btn {
      background: #090d16;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .server-btn.active {
      background: var(--silver-gradient);
      color: #0b0f19;
      border-color: #ffffff;
    }

    .server-btn:hover:not(.active) {
      border-color: var(--accent);
      color: var(--text);
    }

    .player-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      background: #090d16;
      border: 1px solid var(--card-border);
    }

    .player-wrapper iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: 0;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .player-wrapper iframe.loaded { opacity: 1; }

    .player-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      color: var(--text-muted);
      font-size: 0.95rem;
      text-align: center;
      padding: 1.5rem;
      background: #090d16;
      z-index: 2;
    }

    .spinner {
      width: 42px; height: 42px;
      border: 4px solid rgba(226, 232, 240, 0.15);
      border-left-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      background: #070a12;
      border-top: 1px solid var(--card-border);
      padding: 2rem 1.5rem;
      margin-top: auto;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
    }

    @media (max-width: 768px) {
      .modal-top-section { flex-direction: column; }
      .modal-poster { width: 100%; height: 280px; }
      .search-box { max-width: 180px; }
      .movie-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      .card img { height: 210px; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-container">
      <a class="brand" onclick="refreshPage()">
      
        <div>Silver<strong>Stream</strong></div>
      </a>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Film ara..." onkeypress="handleSearch(event)">
        <button onclick="executeSearch()"></button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main>
    <div id="loader" class="loader">Film koleksiyonu hazırlanıyor...</div>
    <div id="searchResultsSection" style="display: none;"></div>
    <div id="categoriesContainer"></div>
  </main>

  <!-- MODAL & MULTI-SERVER PLAYER -->
  <div id="movieModal" class="modal-overlay" onclick="closeModalOnOverlay(event)">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModal()">✕</button>
      
      <div class="modal-body">
        <div class="modal-top-section">
          <img id="modalPoster" class="modal-poster" src="" alt="Afiş">
          <div class="modal-info">
            <h2 id="modalTitle" class="modal-title"></h2>
            <div class="modal-meta-bar">
              <span id="modalYear"></span>
              <span id="modalRating" class="card-rating"></span>
            </div>
            <div id="modalOverview" class="modal-overview"></div>
          </div>
        </div>

        <!-- Çoklu Sunucu Seçimli Player -->
        <div class="player-container">
          <div class="player-header">
            <div class="player-title">▶ Film Oynatıcı</div>
            <div id="serverList" class="server-list"></div>
          </div>
          
          <div class="player-wrapper">
            <!-- Yükleme Katmanı -->
            <div id="playerOverlay" class="player-overlay">
              <div id="playerSpinner" class="spinner"></div>
              <div id="playerStatusText">Kaynak yükleniyor...</div>
            </div>

            <!-- Video Player -->
            <iframe 
              id="streamPlayer" 
              allowfullscreen 
              scrolling="no" 
              onload="onIframeLoad()">
            </iframe>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    © 2026 SilverStream. TMDB altyapısıyla geliştirilmiştir.
  </footer>

  <script>
    const TMDB_API_KEY = "43ddba9df87b2636f3c27ec9f382c85f";
    let currentImdbId = "";
    let currentServerIndex = 0;
    let loadTimeoutTimer = null;
    let isStreamLoaded = false;

    // YENİLENMİŞ GÜNCEL EMBED SUNUCULARI
    const SERVERS = [
      { name: "Sunucu 1", url: (imdbId) => `https://vidmody.com/vs/${imdbId}` },
      { name: "Sunucu 2", url: (imdbId) => `https://vidsrc.me/embed/movie?imdb=${imdbId}` },
      { name: "Sunucu 3", url: (imdbId) => `https://vsembed.ru/embed/movie?imdb=${imdbId}` },
      { name: "Sunucu 4", url: (imdbId) => `https://vsembed.su/embed/movie?imdb=${imdbId}` },
      { name: "Sunucu 5", url: (imdbId) => `https://vidsrc.cc/v2/embed/movie/${imdbId}` },
      { name: "Sunucu 6", url: (imdbId) => `https://vidsrc.xyz/embed/movie?imdb=${imdbId}` }

    ];

    const CATEGORIES = [
      { id: 28, name: " Aksiyon" },
      { id: 878, name: " Bilim Kurgu" },
      { id: 18, name: " Dram" },
      { id: 35, name: " Komedi" },
      { id: 27, name: " Korku" },
      { id: 53, name: " Gerilim" }
    ];

    document.addEventListener('DOMContentLoaded', loadAllCategories);

    function refreshPage() {
      document.getElementById('searchInput').value = '';
      document.getElementById('searchResultsSection').style.display = 'none';
      document.getElementById('categoriesContainer').style.display = 'block';
      loadAllCategories();
    }

    async function loadAllCategories() {
      const container = document.getElementById('categoriesContainer');
      const loader = document.getElementById('loader');
      container.innerHTML = '';
      loader.style.display = 'block';

      for (const cat of CATEGORIES) {
        try {
          const page = Math.floor(Math.random() * 15) + 1;
          const url = `https://api.themoviedb.org/3/discover/movie?api_key=${TMDB_API_KEY}&with_genres=${cat.id}&language=tr-TR&page=${page}`;
          const res = await fetch(url);
          const data = await res.json();
          if (data.results) {
            renderCategorySection(cat.name, data.results.slice(0, 12));
          }
        } catch (e) { console.error(e); }
      }
      loader.style.display = 'none';
    }

    function renderCategorySection(title, movies) {
      const container = document.getElementById('categoriesContainer');
      const section = document.createElement('div');
      section.className = 'category-section';

      let gridHtml = movies.map(m => createMovieCardHtml(m)).join('');
      section.innerHTML = `
        <div class="category-title"><span>${title}</span></div>
        <div class="movie-grid">${gridHtml}</div>
      `;
      container.appendChild(section);
    }

    function createMovieCardHtml(movie) {
      const poster = movie.poster_path ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` : 'https://via.placeholder.com/500x750?text=Afi%C5%9F+Yok';
      const movieData = JSON.stringify(movie).replace(/'/g, "&apos;").replace(/"/g, "&quot;");

      return `
        <div class="card" onclick='openModal(${movieData})'>
          <img src="${poster}" alt="${movie.title}" loading="lazy">
          <div class="card-content">
            <div class="card-title">${movie.title}</div>
            <div class="card-meta">
              <span>📅 ${movie.release_date ? movie.release_date.split('-')[0] : 'N/A'}</span>
              <span class="card-rating">★ ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A'}</span>
            </div>
          </div>
        </div>
      `;
    }

    async function openModal(movie) {
      clearTimeout(loadTimeoutTimer);
      document.getElementById('modalPoster').src = movie.poster_path ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` : '';
      document.getElementById('modalTitle').innerText = movie.title;
      document.getElementById('modalYear').innerText = `📅 ${movie.release_date || 'N/A'}`;
      document.getElementById('modalRating').innerText = `★ ${movie.vote_average ? movie.vote_average.toFixed(1) : 'N/A'}`;
      document.getElementById('modalOverview').innerText = movie.overview || 'Özet bulunmuyor.';

      document.getElementById('movieModal').classList.add('active');
      document.body.style.overflow = 'hidden';

      // IMDb ID Çek
      try {
        const extRes = await fetch(`https://api.themoviedb.org/3/movie/${movie.id}/external_ids?api_key=${TMDB_API_KEY}`);
        const extData = await extRes.json();
        
        if (extData && extData.imdb_id) {
          currentImdbId = extData.imdb_id;
          renderServerButtons();
          loadServer(0);
        } else {
          showError('⚠️ Bu film için IMDb kimliği bulunamadı.');
        }
      } catch (err) {
        showError('⚠️ Bağlantı hatası.');
      }
    }

    function renderServerButtons() {
      const serverList = document.getElementById('serverList');
      serverList.innerHTML = SERVERS.map((server, index) => `
        <button class="server-btn ${index === 0 ? 'active' : ''}" id="srvBtn_${index}" onclick="switchServer(${index})">
          ${server.name}
        </button>
      `).join('');
    }

    function switchServer(index) {
      document.querySelectorAll('.server-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`srvBtn_${index}`);
      if (activeBtn) activeBtn.classList.add('active');

      loadServer(index);
    }

    function loadServer(index) {
      clearTimeout(loadTimeoutTimer);
      isStreamLoaded = false;
      currentServerIndex = index;

      const player = document.getElementById('streamPlayer');
      const overlay = document.getElementById('playerOverlay');
      const spinner = document.getElementById('playerSpinner');
      const statusText = document.getElementById('playerStatusText');

      player.classList.remove('loaded');
      player.src = '';
      overlay.style.display = 'flex';
      spinner.style.display = 'block';
      statusText.innerText = `${SERVERS[index].name} bağlanıyor...`;

      player.src = SERVERS[index].url(currentImdbId);

      // Timeout - 5 saniyede yüklenmezse otomatik sonraki sunucuya geç
      loadTimeoutTimer = setTimeout(() => {
        if (!isStreamLoaded) {
          if (currentServerIndex + 1 < SERVERS.length) {
            statusText.innerText = `${SERVERS[currentServerIndex].name} yanıt vermedi, sonraki sunucu deneniyor...`;
            setTimeout(() => switchServer(currentServerIndex + 1), 1000);
          } else {
            showError('⚠️ Tüm sunucular denendi ancak kaynağa ulaşılamadı.');
          }
        }
      }, 5000);
    }

    function onIframeLoad() {
      const player = document.getElementById('streamPlayer');
      if (player.src && player.src !== 'about:blank' && player.src !== window.location.href) {
        isStreamLoaded = true;
        clearTimeout(loadTimeoutTimer);
        document.getElementById('playerOverlay').style.display = 'none';
        player.classList.add('loaded');
      }
    }

    function showError(msg) {
      clearTimeout(loadTimeoutTimer);
      document.getElementById('playerSpinner').style.display = 'none';
      document.getElementById('playerStatusText').innerText = msg;
    }

    function closeModal() {
      clearTimeout(loadTimeoutTimer);
      document.getElementById('streamPlayer').src = '';
      document.getElementById('movieModal').classList.remove('active');
      document.body.style.overflow = 'auto';
    }

    function closeModalOnOverlay(e) {
      if (e.target.id === 'movieModal') closeModal();
    }

    function handleSearch(e) { if (e.key === 'Enter') executeSearch(); }
    
    async function executeSearch() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;
      
      const resultsSection = document.getElementById('searchResultsSection');
      document.getElementById('categoriesContainer').style.display = 'none';
      resultsSection.style.display = 'block';
      resultsSection.innerHTML = '<div class="loader">Aranıyor...</div>';

      const res = await fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}&language=tr-TR`);
      const data = await res.json();

      if (data.results && data.results.length > 0) {
        resultsSection.innerHTML = `
          <div class="category-section">
            <div class="category-title"><span>🔍 Arama Sonuçları: ${query}</span></div>
            <div class="movie-grid">${data.results.map(m => createMovieCardHtml(m)).join('')}</div>
          </div>`;
      } else {
        resultsSection.innerHTML = '<div class="loader">Sonuç bulunamadı.</div>';
      }
    }
  </script>
</body>
</html>
